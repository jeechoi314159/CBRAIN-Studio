# ---- Bluetooth (BLE peripheral) ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="CBRAIN"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=20
CONFIG_BT_MAX_CONN=1

# Custom CB GATT service is defined in src/main.c (no NUS).

# ---- Low-frequency clock ----
# The CB_INTAN board has no 32.768 kHz crystal -> internal RC.
# (The 32 MHz HFXO crystal X1 is used as-is for the radio.)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# ---- Throughput (streaming) ----
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_GATT_NOTIFY_MULTIPLE=n

# ---- Console over SEGGER RTT (no UART pins on this board) ----
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

# ---- SPI (RHD2216 amplifier) ----
CONFIG_SPI=y

# ---- On-device DSP (band-power LED gate) ----
CONFIG_FPU=y
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y

# ---- PWM (RGB LED intensity) ----
CONFIG_PWM=y

# ---- Sample-accurate timing (A1) ----
# 32768 Hz system tick -> a 1024 Hz sample timer is exactly 32 ticks.
# Absolute fs accuracy is still bounded by the RC LFCLK (±500 ppm); the timer
# only removes intra-frame bunching and long-run drift.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=32768
