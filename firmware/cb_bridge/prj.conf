# CB Bridge — nRF52840 동글: 단일링크 BLE central ↔ USB CDC ACM 투명 브리지.
# 헤드스테이지(cb_intan)는 peripheral, 이쪽은 central. UUID/처리량 설정은 헤드스테이지와 맞춤.

# ---- Bluetooth (BLE central, 1 링크) ----
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="CB Bridge"

# ---- Throughput (헤드스테이지와 동일) ----
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_GATT_NOTIFY_MULTIPLE=n

# ---- USB CDC ACM (legacy USB device stack — 단순) ----
# 동글 보드는 기본적으로 새 스택(device_next)으로 CDC 콘솔 백엔드를 강제한다.
# 그걸 끄고(=n) legacy 스택만 써서 CDC 를 순수 데이터 파이프로 전용한다(콘솔은 RTT).
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="CBRAIN Bridge"
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x520F
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_RING_BUFFER=y

# ---- Console/log: RTT (동글은 UART 콘솔 핀 없음; CDC 는 데이터 전용) ----
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y

# ---- Low-frequency clock (동글에 32.768kHz 크리스털 있으면 XTAL, 없으면 RC) ----
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# ---- 타깃 영속화 (런타임 페어링: 호스트가 CDC 로 SET_TARGET → flash 저장 → 부팅 시 로드) ----
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
# settings_save_one(NVS flash 쓰기)을 시스템 워크큐에서 하므로 스택 여유 확보
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# **핵심**: flash 쓰기를 softdevice controller 라디오와 MPSL 타임슬롯으로 동기화.
# (기본은 SW-LL 이 아니면 NONE → flash 쓰기가 BLE 를 망가뜨려 SET_TARGET 후 재연결 실패)
CONFIG_SOC_FLASH_NRF_RADIO_SYNC_MPSL=y
